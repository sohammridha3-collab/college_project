<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Student Admission Portal</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('portal_theme');
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var theme = saved || (prefersDark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <a class="skip" href="#view">Skip to content</a>
    <div class="shell">
        <aside class="side" id="side">
            <div class="brand">
                <i data-lucide="graduation-cap"></i> Admission Portal
            </div>
            <nav id="nav" aria-label="Main navigation"></nav>
        </aside>
        <div id="backdrop" class="backdrop" aria-hidden="true"></div>
        <div>
            <header class="top">
                <button id="menu" class="btn ghost" aria-label="Toggle menu" aria-expanded="false">
                    <i data-lucide="menu"></i>
                </button>
                <div class="top-actions">
                    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch theme" title="Switch theme">
                        <span class="sun-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="5"></circle>
                                <line x1="12" y1="1" x2="12" y2="3"></line>
                                <line x1="12" y1="21" x2="12" y2="23"></line>
                                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                                <line x1="1" y1="12" x2="3" y2="12"></line>
                                <line x1="21" y1="12" x2="23" y2="12"></line>
                                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                            </svg>
                        </span>
                        <span class="moon-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                            </svg>
                        </span>
                    </button>
                    <span id="who"></span>
                    <button id="logout" class="btn">Log out</button>
                </div>
            </header>
            <main id="view" tabindex="-1">
                <div class="empty">
                    <span class="spin" role="status" aria-label="Loading"></span>
                </div>
            </main>
        </div>
    </div>
    <div id="toasts" aria-live="polite"></div>
    <dialog id="dlg"></dialog>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script type="module" src="js/theme.js"></script>
    <script type="module" src="js/app.js"></script>
</body>

</html>
